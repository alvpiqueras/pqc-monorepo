name: Build liboqs base image

on:
  push:
    branches:
      - main
    paths:
      - "liboqs/**"
      - "docker/liboqs-base.Dockerfile"
      - ".github/workflows/build-liboqs-base.yml"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional stable Docker tag, for example tfm-v1.0.0"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-liboqs-base:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qcs-liboqs-base
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      - name: Build and push liboqs base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/liboqs-base.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}