services:
  gateway:
    build:
      context: ..
      dockerfile: api-mTLS/gateway/Dockerfile
    container_name: mtls-gateway
    ports:
      - "8010:8000"
    environment:
      SERVICE_NAME: "gateway"
      INTERNAL_CA_URL: "https://internal-ca.onrender.com"
      CLIENT_SERVICE_URL: "http://client:8000"
      SERVER_SERVICE_URL: "http://server:8000"
      INTERNAL_DEMO_TOKEN: "dev-mtls-token"
    depends_on:
      - client
      - server

  client:
    build:
      context: ..
      dockerfile: api-mTLS/client/Dockerfile
    container_name: mtls-client
    environment:
      SERVICE_NAME: "client"
      SERVER_SERVICE_URL: "http://server:8000"
      INTERNAL_DEMO_TOKEN: "dev-mtls-token"

  server:
    build:
      context: ..
      dockerfile: api-mTLS/server/Dockerfile
    container_name: mtls-server
    environment:
      SERVICE_NAME: "server"
      INTERNAL_DEMO_TOKEN: "dev-mtls-token"